  <div class="container">
    <h1 class="title">命运排盘</h1>
    <p class="subtitle">输入出生日期与时辰，排出你的四柱八字（年 / 月 / 日 / 时柱）。纯属娱乐，命理仅供参考 😄</p>

    <!-- 输入区 -->
    <div class="card" style="text-align:center">
      <div class="form-row">
        <input id="birthDate" type="date">
        <input id="birthTime" type="time">
        <button class="btn" onclick="paiPan()">🧧 排八字</button>
      </div>
      <p class="muted" style="margin-top:10px">时辰可留空（留空则只排年 / 月 / 日三柱）</p>
    </div>

    <!-- 结果区（初始隐藏） -->
    <div class="card" id="resultBox" style="display:none; text-align:center">
      <h2 id="bTitle">你的八字</h2>
      <p class="fortune-date" id="bSub"></p>

      <div class="bazi-grid" id="bGrid"></div>
      <p id="bZodiac" style="margin-top:14px"></p>

      <div style="margin-top:16px"><span class="muted">五行分布</span></div>
      <div class="wuxing-row" id="bWx"></div>

      <div class="bazi-analysis" id="bAnalysis"></div>

      <p class="bazi-note" id="bNote"></p>

      <div class="btn-row">
        <button class="btn" onclick="copyBazi()">📋 复制结果</button>
      </div>
    </div>

    <footer>人生重启研究所 · 仅供娱乐 · <a href="privacy.html" style="color:var(--muted)">隐私·免责</a></footer>
  </div>

  <script src="js/lunar.js"></script>
  <script>
  let lastBazi = null;

  // 排八字
  function paiPan() {
    const dval = document.getElementById('birthDate').value;
    if (!dval) { showToast('请先选择出生日期'); return; }
    const parts = dval.split('-');
    const y = +parts[0], m = +parts[1], d = +parts[2];
    const tval = document.getElementById('birthTime').value;
    const hour = tval ? +tval.split(':')[0] : null;

    const detail = window.lunar.baziDetail(y, m, d, hour);
    const p = detail.pillars;
    lastBazi = { y, m, d, hour, detail };

    // 生肖图鉴：记录排盘的生肖（仅存本地）
    const tz = Store.get('tujian_zodiac', []);
    if (tz.indexOf(p.zodiac) < 0) { tz.push(p.zodiac); Store.set('tujian_zodiac', tz); }

    // 农历生日 + 星期
    const lun = window.lunar.lunarDate(y, m, d);
    const week = ['日', '一', '二', '三', '四', '五', '六'];
    const dow = new Date(y, m - 1, d).getDay();
    document.getElementById('bTitle').textContent = '🧧 ' + p.year.gan + p.year.zhi + '年 出生';
    document.getElementById('bSub').textContent =
      y + '年' + m + '月' + d + '日 · 星期' + week[dow] +
      ' · 农历' + lun.gan + lun.zhi + '年' + lun.monthCn + lun.dayCn +
      (hour !== null ? ' · ' + shichenName(hour) : '');

    // 四柱（含纳音五行）
    const cells = [
      { name: '年柱', gz: p.year.gan + p.year.zhi, wx: wxOf(p.year.gan, p.year.zhi), ny: window.lunar.nayinOf(p.year.gan, p.year.zhi) },
      { name: '月柱', gz: p.month.gan + p.month.zhi, wx: wxOf(p.month.gan, p.month.zhi), ny: window.lunar.nayinOf(p.month.gan, p.month.zhi) },
      { name: '日柱', gz: p.day.gan + p.day.zhi, wx: wxOf(p.day.gan, p.day.zhi), ny: window.lunar.nayinOf(p.day.gan, p.day.zhi) },
      { name: '时柱', gz: p.hour ? p.hour.gan + p.hour.zhi : '--', wx: p.hour ? wxOf(p.hour.gan, p.hour.zhi) : '未填', ny: p.hour ? window.lunar.nayinOf(p.hour.gan, p.hour.zhi) : '' }
    ];
    const grid = document.getElementById('bGrid');
    grid.innerHTML = '';
    for (const c of cells) {
      const div = document.createElement('div');
      div.className = 'bazi-cell';
      div.innerHTML =
        '<div class="name">' + c.name + '</div><div class="gz">' + c.gz +
        '</div><div class="wx">' + c.wx + '</div>' + (c.ny ? '<div class="ny">' + c.ny + '</div>' : '');
      grid.appendChild(div);
    }

    document.getElementById('bZodiac').innerHTML = '🐉 生肖：' + p.zodiac;

    // 五行统计
    const wxBox = document.getElementById('bWx');
    wxBox.innerHTML = '';
    for (const k of ['木', '火', '土', '金', '水']) {
      const n = detail.wuxing[k] || 0;
      const box = document.createElement('div');
      box.className = 'wx-box';
      box.innerHTML = '<b>' + k + '</b><span>' + n + '</span>';
      wxBox.appendChild(box);
    }

    // 五行缺 + 补益 + 生肖冲合
    const ZODIAC_ARR = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    const zIdx = ZODIAC_ARR.indexOf(p.zodiac);
    const missing = window.lunar.wuxingMissing(detail.wuxing);
    const ch = window.lunar.zodiacChongHe(zIdx);
    let ana = '';
    if (missing.length) {
      ana += '<p><strong>五行缺：</strong>' + missing.join('、') + '</p>';
      ana += '<p><strong>补益：</strong>平时可多穿 <b>' + missing.map(k => window.lunar.WX_COLOR[k]).join('、') +
        '</b>，多朝 <b>' + missing.map(k => window.lunar.WX_DIR[k]).join('、') + '</b> 方向走走。</p>';
    } else {
      ana += '<p><strong>五行齐备</strong>，运势平稳，恭喜！</p>';
    }
    ana += '<p><strong>生肖：</strong>' + p.zodiac + '，与 <b>' + ch.chong + '</b> 相冲、与 <b>' + ch.he + '</b> 相合。</p>';
    document.getElementById('bAnalysis').innerHTML = ana;

    document.getElementById('bNote').textContent =
      hour === null ? '未填时辰，故只排三柱（年 / 月 / 日）' : '以上为公历排盘，命理玄学仅供娱乐';

    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }

  // 一柱的五行（天干五行 + 地支五行）
  function wxOf(gan, zhi) {
    const g = { 甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水' }[gan] || '';
    const z = { 子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水' }[zhi] || '';
    return g + z;
  }

  // 时辰名（0-23 点 → 寅时等）
  function shichenName(hour) {
    const names = ['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
    return names[Math.floor((hour + 1) / 2) % 12];
  }

  // 复制结果
  function copyBazi() {
    if (!lastBazi) return;
    const detail = lastBazi.detail;
    const p = detail.pillars;
    const missing = window.lunar.wuxingMissing(detail.wuxing);
    const zIdx = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'].indexOf(p.zodiac);
    const ch = window.lunar.zodiacChongHe(zIdx);
    const lines = [
      '🧧 八字排盘',
      '公历：' + lastBazi.y + '年' + lastBazi.m + '月' + lastBazi.d + '日' + (lastBazi.hour !== null ? ' ' + lastBazi.hour + '时' : ''),
      '四柱：年 ' + p.year.gan + p.year.zhi + '　月 ' + p.month.gan + p.month.zhi + '　日 ' + p.day.gan + p.day.zhi + (p.hour ? '　时 ' + p.hour.gan + p.hour.zhi : ''),
      '纳音：年 ' + window.lunar.nayinOf(p.year.gan, p.year.zhi) +
        '　月 ' + window.lunar.nayinOf(p.month.gan, p.month.zhi) +
        '　日 ' + window.lunar.nayinOf(p.day.gan, p.day.zhi) +
        (p.hour ? '　时 ' + window.lunar.nayinOf(p.hour.gan, p.hour.zhi) : ''),
      '五行：' + (missing.length ? '缺 ' + missing.join('、') : '齐备') + '　·　生肖 ' + p.zodiac +
        '（与 ' + ch.chong + ' 冲、与 ' + ch.he + ' 合）',
      '—— 命理玄学，开心就好 😄'
    ];
    navigator.clipboard.writeText(lines.join('\n'))
      .then(() => showToast('✅ 八字结果已复制！'))
      .catch(() => showToast('复制失败，请手动复制：\n\n' + lines.join('\n')));
  }
  </script>
  <script src="js/store.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/ui.js"></script>
  <script>
  // 记住出生日期/时辰 + 排盘音效（数据仅存本地）
  window.addEventListener('load', function () {
    var d = document.getElementById('birthDate'), t = document.getElementById('birthTime');
    var v = Store.get('bazi_input', null);
    if (v && d) { if (v.date) d.value = v.date; if (t && v.time) t.value = v.time; }
    d.addEventListener('change', save); if (t) t.addEventListener('change', save);
    function save() { Store.set('bazi_input', { date: d.value, time: t.value }); }
    var btn = document.querySelector('.form-row .btn'); if (btn) btn.addEventListener('click', function () { playSfx('good'); });
  });
  </script>
