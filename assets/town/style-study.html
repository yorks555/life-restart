<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>栖迟小镇 · 淡彩绘本美术样张</title><style>body{margin:32px;background:#f4f0e4;color:#516957;font:14px 'Microsoft YaHei';}h1{font:26px SimSun}canvas{max-width:100%;height:auto;border-radius:12px}p{color:#7c8774;line-height:1.8}.ages{display:flex;gap:16px;flex-wrap:wrap}.ages figure{margin:0;text-align:center}.ages img{width:128px;border-radius:12px}.ages figcaption{padding:10px}</style><h1>栖迟小镇 · 淡彩绘本</h1><p>轻俯视 · 左上光照 · 柔和灰绿线条 · 米白纸与暖木 · 同一比例</p><canvas id="study" width="800" height="400" aria-label="住宅、树、旅人、道路和水体画风样张"></canvas><p>同一位旅人，在人生的五个阶段。</p><div class="ages" id="ages"></div><script src="../../js/town-renderer.js"></script><script>TownRenderer.study(document.getElementById('study'));for(let stage=0;stage<5;stage++){const f=document.createElement('figure'),img=document.createElement('img'),label=document.createElement('figcaption');img.src=TownRenderer.portrait(stage);img.alt=label.textContent=TownRenderer.appearance(stage).name;f.append(img,label);document.getElementById('ages').append(f);}</script></html>
