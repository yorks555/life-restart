</head>

  <div class="container">
    <h1 class="title title-grad">人生统计</h1>
    <p class="subtitle">你的人生已经走到哪了？看看进度，配一句调侃 🪙</p>

    <!-- 输入区 -->
    <div class="card">
      <div class="form-row">
        <input id="birthDate" type="date">
        <input id="lifeSpan" type="number" placeholder="预期寿命(默认80)" min="1" max="120">
        <button class="btn" onclick="calProgress()">🪙 算进度</button>
      </div>
      <p class="muted" style="text-align:center; margin-top:10px">出生日期必填；预期寿命留空按 80 岁算</p>
    </div>

    <!-- 结果区（初始隐藏） -->
    <div class="card" id="resultBox" style="display:none; text-align:center">
      <h2 id="pTitle">你的人生进度</h2>
      <p class="fortune-date" id="pSub"></p>

      <p class="progress-num" id="pPercent">0%</p>

      <div class="progress-track"><div class="progress-fill" id="pFill" style="width:0%"><span class="dot"></span></div></div>

      <div class="progress-tags" id="pTags"></div>

      <p class="progress-say warm-grad" id="pSay"></p>

      <div class="btn-row">
        <button class="btn" onclick="copyProgress()">📋 复制文案</button>
        <button class="btn ghost" onclick="downloadProgress()">🖼️ 下载卡片</button>
      </div>
    </div>

    <footer>人生重启研究所 · 仅供娱乐 · <a href="privacy.html" style="color:var(--muted)">隐私·免责</a></footer>
  </div>

  <script src="js/lunar.js"></script>
  <script>
  let lastData = null;

  function calProgress() {
    const dval = document.getElementById('birthDate').value;
    if (!dval) { showToast('请先选择出生日期'); return; }
    const parts = dval.split('-');
    const y = +parts[0], m = +parts[1], d = +parts[2];
    const lifeYears = parseInt(document.getElementById('lifeSpan').value, 10) || 80;

    const birth = new Date(y, m - 1, d);
    const now = new Date();
    const ageDays = Math.floor((now - birth) / 86400000);
    if (ageDays < 0) { showToast('出生日期在未来？回到现实吧 😅'); return; }

    const lifeDays = lifeYears * 365.25;
    const percent = Math.min(100, ageDays / lifeDays * 100);
    const ageYears = ageDays / 365.25;
    const remainDays = Math.max(0, Math.round(lifeDays - ageDays));

    const lun = window.lunar.lunarDate(y, m, d);
    lastData = { y, m, d, lifeYears, ageDays, percent, ageYears, remainDays, lun, zodiac: lun.zodiac };

    document.getElementById('pTitle').textContent = '🪙 ' + lifeYears + ' 岁人生的进度';
    document.getElementById('pSub').textContent =
      y + '年' + m + '月' + d + '日 · 农历' + lun.monthCn + lun.dayCn + ' · 生肖 ' + lun.zodiac;

    // 数字跳动 + 渐变进度条 + 末点
    countUp(document.getElementById('pPercent'), percent, 1);
    const fill = document.getElementById('pFill');
    fill.style.width = '0%';
    requestAnimationFrame(() => { fill.style.width = percent.toFixed(1) + '%'; });

    // 彩色标签：过去 / 未来
    document.getElementById('pTags').innerHTML =
      '<span class="tag tag-past">✅ 已走过 ' + ageDays.toLocaleString() + ' 天</span>' +
      '<span class="tag tag-future">⏳ 还剩 ' + remainDays.toLocaleString() + ' 天</span>';

    // 打字机文案（暖色渐变）
    typewrite(document.getElementById('pSay'), '「' + agePhrase(ageYears) + '」', 55);

    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }

  // 数字从 0 跳到目标值
  function countUp(el, target, decimals) {
    const dur = 1200, t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = (target * eased).toFixed(decimals) + '%';
      if (k < 1) requestAnimationFrame(step);
      else el.textContent = target.toFixed(decimals) + '%';
    }
    requestAnimationFrame(step);
  }

  // 打字机逐字出现
  function typewrite(el, text, speed) {
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    let i = 0;
    function tick() {
      if (i < text.length) { cursor.insertAdjacentText('beforebegin', text[i]); i++; setTimeout(tick, speed); }
    }
    tick();
  }

  function agePhrase(age) {
    if (age < 18) return '还在新手村，未来无限可能，别怕。';
    if (age < 26) return '正是折腾的好时候，去犯错、去体验、去长大。';
    if (age < 36) return '开始懂了，但也别把自己累垮。';
    if (age < 46) return '上有老下有小，稳住，你能行。';
    if (age < 60) return '看淡了很多，是该对自己好一点了。';
    if (age < 75) return '享受生活，感恩走过的每一步。';
    return '人生赢家本家，剩下的都是赚的。';
  }

  function copyProgress() {
    if (!lastData) return;
    const t = [
      '🪙 人生进度条',
      lastData.y + '年' + lastData.m + '月' + lastData.d + '日出生 · 生肖 ' + lastData.zodiac + ' · 预期 ' + lastData.lifeYears + ' 岁',
      '已走过 ' + lastData.ageDays.toLocaleString() + ' 天，还剩 ' + lastData.remainDays.toLocaleString() + ' 天',
      '人生已度过 **' + lastData.percent.toFixed(1) + '%**',
      '『' + agePhrase(lastData.ageYears) + '』',
      '—— 人生进度条，纯属娱乐 😄'
    ].join('\n');
    navigator.clipboard.writeText(t)
      .then(() => showToast('✅ 进度文案已复制！'))
      .catch(() => showToast('复制失败，请手动复制：\n\n' + t));
  }

  function downloadProgress() {
    if (!lastData) return;
    const W = 720, H = 520;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0d1a2b'); g.addColorStop(1, '#152a3d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#e6edf5';
    ctx.font = 'bold 30px "Microsoft YaHei"';
    ctx.fillText('🪙 人生进度条', W / 2, 70);

    ctx.fillStyle = '#8ca0ba';
    ctx.font = '18px "Microsoft YaHei"';
    ctx.fillText(lastData.y + '年' + lastData.m + '月' + lastData.d + '日出生 · 预期 ' + lastData.lifeYears + ' 岁', W / 2, 115);

    ctx.fillStyle = '#5eead4';
    ctx.font = 'bold 64px "Microsoft YaHei"';
    ctx.fillText(lastData.percent.toFixed(1) + '%', W / 2, 210);

    // 渐变进度条 + 末点
    const bx = 80, by = 240, bw = W - 160, bh = 22;
    ctx.fillStyle = '#1d3350'; ctx.fillRect(bx, by, bw, bh);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#5eead4'); grad.addColorStop(1, '#a78bfa');
    ctx.fillStyle = grad; ctx.fillRect(bx, by, bw * lastData.percent / 100, bh);
    const dx = bx + bw * lastData.percent / 100;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(dx, by + bh / 2, 7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e6edf5';
    ctx.font = '20px "Microsoft YaHei"';
    ctx.fillText('已过 ' + lastData.ageDays.toLocaleString() + ' 天 · 还剩 ' + lastData.remainDays.toLocaleString() + ' 天', W / 2, 310);

    ctx.fillStyle = '#f5a623';
    ctx.font = '20px "Microsoft YaHei"';
    ctx.fillText('『' + agePhrase(lastData.ageYears) + '』', W / 2, 380);

    ctx.fillStyle = '#5f7089';
    ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText('—— 人生进度条，纯属娱乐 😄', W / 2, 470);

    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = '人生进度-' + lastData.y + '.png';
    a.click();
  }
  </script>
  <script src="js/store.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/ui.js"></script>
  <script>
  // 记住出生日期/预期寿命 + 算进度音效（数据仅存本地）
  window.addEventListener('load', function () {
    var d = document.getElementById('birthDate'), s = document.getElementById('lifeSpan');
    var v = Store.get('progress_input', null);
    if (v && d) { if (v.date) d.value = v.date; if (s && v.span) s.value = v.span; }
    d.addEventListener('change', save); if (s) s.addEventListener('input', save);
    function save() { Store.set('progress_input', { date: d.value, span: s.value }); }
    var btn = document.querySelector('.form-row .btn'); if (btn) btn.addEventListener('click', function () { playSfx('good'); });
  });
  </script>
</body>
</html>
